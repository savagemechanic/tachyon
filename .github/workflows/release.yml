name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --all-targets
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir package
          cp target/${{ matrix.target }}/release/tachyon package/
          cp README.md LICENSE package/
          tar -czf tachyon-${{ github.ref_name }}-${{ matrix.artifact }}.tar.gz -C package .
          shasum -a 256 tachyon-${{ github.ref_name }}-${{ matrix.artifact }}.tar.gz > tachyon-${{ github.ref_name }}-${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tachyon-*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build combined checksums
        run: sha256sum dist/*.tar.gz | sed 's#dist/##' > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
